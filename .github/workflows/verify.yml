name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=1
      - run: npm run check
      - run: npm run catalog:check
      - run: npm run build
      - run: npm audit
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - name: Validate normal build SEO and robots (no deploy)
        run: node scripts/verify-normal-seo.mjs
      - name: Validate private staging noindex build (no deploy)
        run: |
          GEARPILOT_STAGING_NOINDEX=true npm run build
          node scripts/verify-staging-noindex.mjs
