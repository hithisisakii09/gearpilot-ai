name: Global research queue
on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test -- --run scripts/agent-research-queue.test.mjs
      - run: npm test -- --run scripts/research-evidence-intake.test.mjs
      - run: npm test -- --run scripts/evidence-ledger.test.mjs
      - run: npm test -- --run scripts/evidence-review-packet.test.mjs
      - run: npm test -- --run scripts/reviewer-separation-audit.test.mjs
      - run: npm test -- --run scripts/evidence-retention-audit.test.mjs
      - run: npm test -- --run scripts/evidence-storage-preflight.test.mjs
      - run: node scripts/agent-research-queue.mjs
      - run: npm test -- --run scripts/research-queue-audit.test.mjs
      - run: node scripts/research-queue-audit.mjs artifacts/research-queue-$(date -u +%F).json
      - uses: actions/upload-artifact@v4
        with:
          name: global-research-queue
          path: artifacts/research-queue-*.json
          retention-days: 14
